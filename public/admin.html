<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administração</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

</head>

<body>

  <header class="topbar">

    <h1>Administração do Bolão</h1>

    <button id="qualifiedBtn">
      Classificados
    </button>

    <button id="settingsBtn">
      Configurações
    </button>

    <button id="knockoutBtn">
      <i class="fa-solid fa-trophy"></i>
      Mata-Mata
    </button>

    <button id="resultsBtn">
      Resultados Mata-Mata
    </button>

    <button id="calculateRankingBtn">
      Calcular Ranking
    </button>

    <button id="dashboardBtn">
      <i class="fa-solid fa-house"></i>
      Início
    </button>

    <button id="logoutBtn">
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>

  </header>

  <main>

    <h2 class="main-title">
      Resultados Oficiais — Fase de Grupos
    </h2>

    <div
      id="adminGroupsContainer"
      class="groups-grid"
    ></div>

    <div class="global-save-container">

      <button id="saveOfficialBtn">
        Salvar Resultados Oficiais
      </button>

    </div>

  </main>

  <script type="module" src="js/admin.js"></script>

  <div id="toast"></div>

</body>

</html>
